<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlex Login</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <header class="main-header">
        <a href="index.html" class="brand-logo">StreamFlex</a>
    </header>

    <div class="login-container">
        <h2 class="login-title">Sign In</h2>

        <form class="auth-form">
            <div class="input-group">
                <input type="text" required>
                <label>Email or phone number</label>
            </div>
            <div class="input-group">
                <input type="password" required>
                <label>Password</label>
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
            <div class="form-options">
                <div class="save-credentials">
                    <input type="checkbox" id="save-login">
                    <label for="save-login">Remember me</label>
                </div>
                <a href="#" class="help-link">Need help?</a>
            </div>
        </form>

        <p class="signup-prompt">New to our service? <a href="#">Sign up now</a></p>
        <p class="security-notice">
            This page is protected by Google reCAPTCHA to ensure you're not a bot.
            <a href="#">Learn more.</a>
        </p>
    </div>

    <script>
        document.querySelector(".auth-form").addEventListener("submit", (e) => {
            e.preventDefault();
            window.location.href = "index.html";
        });
    </script>
</body>

</html>
